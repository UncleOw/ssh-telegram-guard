[Definition]
# Отключаем спам при старте и выключении сервера
norestored = true
actionflush = true

actionban = bash -c 'source /etc/ssh/tg_guard.env && curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=<b>❌ IP заблокирован!</b>%%0A<b>Сервер:</b> $(hostname)%%0A<b>Jail:</b> <name>%%0A<b>Адрес:</b> <code><ip></code>%%0A<b>Попыток:</b> <failures>"'

actionunban = bash -c 'source /etc/ssh/tg_guard.env && curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=<b>🟢 IP разблокирован:</b> <code><ip></code> (Сервер: $(hostname))"'
